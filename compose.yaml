services:
  trader:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MODE: paper
      MODEL: mock
      HOST: 0.0.0.0
      DATA_DIR: /app/data
    volumes:
      - trader-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  trader-data:
